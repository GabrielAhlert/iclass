services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iclass
      POSTGRES_PASSWORD: iclass
      POSTGRES_DB: iclass
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iclass"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  tui:
    build: ./tui
    stdin_open: true
    tty: true
    env_file: .env
    depends_on:
      - api
    network_mode: host

volumes:
  pg_data:
